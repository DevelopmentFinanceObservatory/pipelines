unit_tests:
  - name: stg_keeps_every_allocation_status
    model: stg_imputed_multilateral_sectors
    description: >
      allocation_status is an allowlist covering every status oda-data emits, so a
      new status it starts emitting fails loudly here instead of being summed in
      or dropped silently.
    given:
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors')
        rows:
          - {donor_code: 1, recipient_code: 100, channel_code: 901, purpose_code: 11110, year: 2023, value: 10.0, allocation_status: imputed, share_channel_code: 901}
          - {donor_code: 1, recipient_code: 100, channel_code: 902, purpose_code: 11110, year: 2023, value: 5.0, allocation_status: stale_share, share_channel_code: 902}
          - {donor_code: 1, recipient_code: 100, channel_code: 903, purpose_code: 11110, year: 2023, value: 2.0, allocation_status: proxy, share_channel_code: 950}
          - {donor_code: 1, recipient_code: null, channel_code: 904, purpose_code: null, year: 2023, value: 3.0, allocation_status: unallocated, share_channel_code: null}
    expect:
      rows:
        - {donor_code: "1", recipient_code: "100", channel_code: "901", purpose_code: "11110", year: 2023, value: 10.0}
        - {donor_code: "1", recipient_code: "100", channel_code: "902", purpose_code: "11110", year: 2023, value: 5.0}
        - {donor_code: "1", recipient_code: "100", channel_code: "903", purpose_code: "11110", year: 2023, value: 2.0}
        - {donor_code: "1", recipient_code: "9998", channel_code: "904", purpose_code: "998", year: 2023, value: 3.0}

  - name: stg_imputed_multilateral_sectors_excludes_incomplete_years
    model: stg_imputed_multilateral_sectors
    description: A year incomplete_years lists for imputed multilateral sectors is not staged.
    overrides:
      vars:
        incomplete_years: {one_imputed_multilateral_sectors: [2025]}
    given:
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors')
        rows:
          - {donor_code: 1, recipient_code: 100, channel_code: 901, purpose_code: 11110, year: 2024, value: 10.0, allocation_status: imputed, share_channel_code: 901}
          - {donor_code: 1, recipient_code: 100, channel_code: 901, purpose_code: 11110, year: 2025, value: 3.0, allocation_status: imputed, share_channel_code: 901}
    expect:
      rows:
        - {donor_code: "1", recipient_code: "100", channel_code: "901", purpose_code: "11110", year: 2024, value: 10.0}

  - name: stg_assigns_unallocated_recipient_to_fixed_purpose_proxy_rows
    model: stg_imputed_multilateral_sectors
    description: >
      A fixed_purpose proxy row (e.g. UN peacekeeping core contributions under
      channel 41310) is a proxy row with a null share_channel_code and a null
      recipient_code; it comes out mapped to DAC code 9998, "Bilateral,
      unallocated/unspecified". A normal imputed row's recipient is left
      unchanged.
    given:
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors')
        rows:
          - {donor_code: 1, recipient_code: null, channel_code: 41310, purpose_code: 15230, year: 2023, value: 2.0, allocation_status: proxy, share_channel_code: null}
          - {donor_code: 1, recipient_code: 100, channel_code: 901, purpose_code: 11110, year: 2023, value: 10.0, allocation_status: imputed, share_channel_code: 901}
    expect:
      rows:
        - {donor_code: "1", recipient_code: "9998", channel_code: "41310", purpose_code: "15230", year: 2023, value: 2.0}
        - {donor_code: "1", recipient_code: "100", channel_code: "901", purpose_code: "11110", year: 2023, value: 10.0}

  - name: stg_assigns_unspecified_codes_to_unallocated_rows
    model: stg_imputed_multilateral_sectors
    description: >
      An unallocated row carries both a null recipient_code and a null
      purpose_code; it comes out mapped to DAC recipient 9998 and CRS purpose
      998, both meaning "unallocated/unspecified".
    given:
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors')
        rows:
          - {donor_code: 1, recipient_code: null, channel_code: 904, purpose_code: null, year: 2023, value: 3.0, allocation_status: unallocated, share_channel_code: null}
    expect:
      rows:
        - {donor_code: "1", recipient_code: "9998", channel_code: "904", purpose_code: "998", year: 2023, value: 3.0}

  - name: stg_leaves_nulls_outside_the_allowed_allocation_paths_null
    model: stg_imputed_multilateral_sectors
    description: >
      A null recipient_code is legitimate only on an unallocated row or a
      fixed_purpose proxy row (proxy with a null share_channel_code); a null
      purpose_code only on an unallocated row. Every other null comes out
      unchanged, so the not_null tests on recipient_code and purpose_code fail
      on malformed upstream data instead of it being published as 9998 or 998.
    given:
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors')
        rows:
          - {donor_code: 1, recipient_code: null, channel_code: 901, purpose_code: 11110, year: 2023, value: 1.0, allocation_status: imputed, share_channel_code: 901}
          - {donor_code: 1, recipient_code: 100, channel_code: 902, purpose_code: null, year: 2023, value: 2.0, allocation_status: stale_share, share_channel_code: 902}
          - {donor_code: 1, recipient_code: null, channel_code: 903, purpose_code: 11110, year: 2023, value: 3.0, allocation_status: proxy, share_channel_code: 950}
          - {donor_code: 1, recipient_code: null, channel_code: 41310, purpose_code: null, year: 2023, value: 4.0, allocation_status: proxy, share_channel_code: null}
    expect:
      rows:
        - {donor_code: "1", recipient_code: null, channel_code: "901", purpose_code: "11110", year: 2023, value: 1.0}
        - {donor_code: "1", recipient_code: "100", channel_code: "902", purpose_code: null, year: 2023, value: 2.0}
        - {donor_code: "1", recipient_code: null, channel_code: "903", purpose_code: "11110", year: 2023, value: 3.0}
        - {donor_code: "1", recipient_code: "9998", channel_code: "41310", purpose_code: null, year: 2023, value: 4.0}

  - name: resolved_resolves_an_organization_donor_alongside_a_country_recipient
    model: int_imputed_multilateral_sectors_resolved
    description: >
      A multilateral institution can itself be a contributing provider, so the
      entities CTE's `list in (...)` must keep resolving both
      dcid:Organization and dcid:Country donors. Narrowing that list to
      countries only would pass silently with no fixture exercising it.
    given:
      - input: ref('stg_imputed_multilateral_sectors')
        rows:
          - {donor_code: "901", recipient_code: "110", channel_code: "41304", purpose_code: "12220", year: 2022, value: 5}
      - input: ref('code_mapping')
        rows:
          - {list: "dcid:Organization", property: dacCode, code: "901", dcid: "dcid:UNDP"}
          - {list: "dcid:Country", property: dacCode, code: "110", dcid: "dcid:country/KEN"}
    expect:
      rows:
        - {donor: "dcid:UNDP", recipient: "dcid:country/KEN"}

  - name: mapped_mints_the_statvar_and_names_its_parts
    model: int_imputed_multilateral_sectors_mapped
    description: >
      For purpose 12220, gross disbursement, ODA, current prices, the minted
      DCID is this exact string. Constraint order follows mint_statvar_dcid's
      ordered dict (nettingBasis, financialFlowType, crsTypeOfFlow,
      dac2aAidType, crsPurpose), which is not alphabetical. The DCID reads only
      the dict values, so constraint_properties pins the keys. The name drops
      the "(CRS Purpose)" suffix from the label. The donor becomes the
      financing provider and the recipient the financing recipient, and the
      given values differ so a swap of the two fails.
    given:
      - input: ref('int_imputed_multilateral_sectors_aggregated')
        rows:
          - {year: 2022, donor: "dcid:country/FRA", recipient: "dcid:country/KEN", purpose_code: "12220", value: 5}
      - input: ref('code_mapping')
        rows:
          - {list: "dcid:CRSPurposeCodeEnum", property: classificationCode, code: "12220", dcid: "dcid:CRSPurposeCode12220", label: basic health care (CRS Purpose)}
      - input: ref('stat_type_mapping')
        rows:
          - {stat_type: measuredValue, dcid_segment: null}
    expect:
      rows:
        - statvar_dcid: "dcid:AttributedAmount_FinancialFlow_Gross_Disbursement_CRSTypeOfFlow10_DAC2aAidType106_CRSPurposeCode12220_Nominal"
          statvar_name: "Imputed multilateral ODA gross disbursements for basic health care"
          constraint_properties: "nettingBasis,financialFlowType,crsTypeOfFlow,dac2aAidType,crsPurpose"
          financing_provider: "dcid:country/FRA"
          financing_recipient: "dcid:country/KEN"

  - name: mapped_resolves_purpose_within_its_own_code_system
    model: int_imputed_multilateral_sectors_mapped
    description: >
      A code identifies a node only within its own code system, and codes are
      shared across them, so an unscoped join would take the purpose dimension
      from the wrong vocabulary.
    given:
      - input: ref('int_imputed_multilateral_sectors_aggregated')
        rows:
          - {year: 2022, donor: D1, recipient: R1, purpose_code: "110"}
      - input: ref('code_mapping')
        rows:
          - {list: "dcid:CRSPurposeCodeEnum", property: classificationCode, code: "110", dcid: "dcid:CRSPurposeCode110"}
          - {list: "dcid:CRSTypeOfFinanceEnum", property: classificationCode, code: "110", dcid: "dcid:OtherVocabulary110"}
      - input: ref('stat_type_mapping')
        rows:
          - {stat_type: measuredValue, dcid_segment: null}
    expect:
      rows:
        - {purpose_code: "dcid:CRSPurposeCode110"}

  - name: mapped_carries_every_constant_dimension
    model: int_imputed_multilateral_sectors_mapped
    description: >
      The source data holds these dimensions constant, so the model sets them
      as literals and derives none per row. A per-row case would let a future
      column start branching on real data unnoticed.
    given:
      - input: ref('int_imputed_multilateral_sectors_aggregated')
        rows:
          - {year: 2022, donor: D1, recipient: R1, purpose_code: "110"}
          - {year: 2022, donor: D2, recipient: R2, purpose_code: "111"}
      - input: ref('code_mapping')
        rows: []
      - input: ref('stat_type_mapping')
        rows:
          - {stat_type: measuredValue, dcid_segment: null}
    expect:
      rows:
        - {population_type: "dcid:FinancialFlow", measured_property: "dcid:attributedAmount", stat_type: "dcid:measuredValue", netting_basis: "dcid:Gross", financial_flow_type: "dcid:Disbursement", type_of_flow: "dcid:CRSTypeOfFlow10", aid_type: "dcid:DAC2aAidType106", measurement_qualifier: "dcid:Nominal", measurement_method: "dcid:Modelled", unit: "dcid:CurrencyUSD"}
        - {population_type: "dcid:FinancialFlow", measured_property: "dcid:attributedAmount", stat_type: "dcid:measuredValue", netting_basis: "dcid:Gross", financial_flow_type: "dcid:Disbursement", type_of_flow: "dcid:CRSTypeOfFlow10", aid_type: "dcid:DAC2aAidType106", measurement_qualifier: "dcid:Nominal", measurement_method: "dcid:Modelled", unit: "dcid:CurrencyUSD"}

  - name: aggregated_sums_value_across_channels
    model: int_imputed_multilateral_sectors_aggregated
    description: >
      Summing over channel_code is this model's entire purpose. Two rows
      sharing year, donor, recipient and purpose but differing in
      channel_code must collapse into one row holding their sum, not a max,
      min or first value, while a row in a different group is left alone.
    given:
      - input: ref('int_imputed_multilateral_sectors_resolved')
        rows:
          - {year: 2022, donor: D1, recipient: R1, purpose_code: "110", channel_code: "41304", value: 3}
          - {year: 2022, donor: D1, recipient: R1, purpose_code: "110", channel_code: "41307", value: 4}
          - {year: 2022, donor: D2, recipient: R2, purpose_code: "111", channel_code: "41304", value: 10}
    expect:
      rows:
        - {year: 2022, donor: D1, recipient: R1, purpose_code: "110", value: 7}
        - {year: 2022, donor: D2, recipient: R2, purpose_code: "111", value: 10}
  - name: statvars_are_one_row_per_variable
    model: dc_imputed_multilateral_sectors_statvars
    description: >
      Mapped rows sharing a variable collapse to one node, so the StatVar table
      is the distinct set of variables, and a node cannot disagree with the
      observations pointing at it. Both are projections of the same mapped row.
    given:
      - input: ref('int_imputed_multilateral_sectors_mapped')
        rows:
          - {statvar_dcid: SV1, statvar_name: name a, aid_type: "dcid:DAC2aAidType106", purpose_code: "dcid:CRSPurposeCode12220", financing_provider: France}
          - {statvar_dcid: SV1, statvar_name: name a, aid_type: "dcid:DAC2aAidType106", purpose_code: "dcid:CRSPurposeCode12220", financing_provider: Germany}
    expect:
      rows:
        - {dcid: SV1, name: name a, aid_type: "dcid:DAC2aAidType106", purpose_code: "dcid:CRSPurposeCode12220"}

  - name: observations_scale_amounts_to_whole_currency_units
    model: dc_imputed_multilateral_sectors_observations
    description: oda-data returns millions, so observation values are scaled up.
    given:
      - input: ref('int_imputed_multilateral_sectors_mapped')
        rows:
          - {statvar_dcid: SV1, year: 2024, financing_provider: "dcid:country/FRA", financing_recipient: "dcid:country/KEN", value: 1.44734, unit: "dcid:CurrencyUSD", measurement_method: "dcid:Modelled"}
          - {statvar_dcid: SV2, year: 2024, financing_provider: "dcid:country/DEU", financing_recipient: "dcid:country/UGA", value: -3690.32613, unit: "dcid:CurrencyUSD", measurement_method: "dcid:Modelled"}
    expect:
      rows:
        - {variable: SV1, date: 2024, financing_provider: "dcid:country/FRA", financing_recipient: "dcid:country/KEN", value: 1447340.00, unit: "dcid:CurrencyUSD", measurement_method: "dcid:Modelled"}
        - {variable: SV2, date: 2024, financing_provider: "dcid:country/DEU", financing_recipient: "dcid:country/UGA", value: -3690326130.00, unit: "dcid:CurrencyUSD", measurement_method: "dcid:Modelled"}

  - name: provenance_reports_the_dates_it_publishes
    model: dc_imputed_multilateral_sectors_provenance
    given:
      - input: ref('dc_imputed_multilateral_sectors_observations')
        rows:
          - {date: 2019}
          - {date: 2015}
          - {date: 2023}
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors_metadata')
        rows:
          - {downloaded_at: "2026-08-18 23:47:05+00", crs_release_date: "2025-12-15", multisystem_release_date: "2025-12-15"}
    expect:
      rows:
        - {source_release_frequency: P3M, next_source_release_date: "2026-04", earliest_observation_date: "2015", latest_observation_date: "2023"}

  - name: provenance_holds_an_overdue_release_date_in_the_past
    model: dc_imputed_multilateral_sectors_provenance
    description: >
      A release already overdue by the time the pipeline downloads leaves
      next_source_release_date anchored to the release it has.
    given:
      - input: ref('dc_imputed_multilateral_sectors_observations')
        rows:
          - {date: 2023}
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors_metadata')
        rows:
          - {downloaded_at: "2026-07-20 09:00:00+00", crs_release_date: "2026-01-16", multisystem_release_date: "2026-01-16"}
    expect:
      rows:
        - {next_source_release_date: "2026-04"}

  - name: provenance_cites_each_source_with_its_own_year_and_leads_with_the_later_one
    model: dc_imputed_multilateral_sectors_provenance
    description: >
      CRS and Members' Total Use publish on independent schedules, so their
      release years can differ. license_attribution cites each source with
      its own release year, and the leading "ONE (year)" citation uses the
      later of the two - here CRS's 2026, not Members' Total Use's 2025.
      next_source_release_date is the earlier of the two sources' next
      releases: CRS's next (September, after its August release) beats
      Members' Total Use's next (December of the year after its December
      release).
    given:
      - input: ref('dc_imputed_multilateral_sectors_observations')
        rows:
          - {date: 2023}
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors_metadata')
        rows:
          - {downloaded_at: "2026-09-11 00:00:00+00", crs_release_date: "2026-08-03", multisystem_release_date: "2025-12-18"}
    expect:
      rows:
        - {imported_source_release_date: "2026-08-03", next_source_release_date: "2026-09", license_attribution: "ONE (2026), Imputed Multilateral Sectors, https://docs.one.org/methodologies/data/oda/imputed-multilateral-sectors/ (accessed on 2026-09-11), computed from OECD (2026), Creditor Reporting System (CRS), https://sdmx.oecd.org/public/rest/dataflow/OECD.DCD.FSD/DSD_CRS@DF_CRS/ (accessed on 2026-09-11) and OECD (2025), Members' Total Use of the Multilateral System, https://sdmx.oecd.org/public/rest/dataflow/OECD.DCD.FSD/DSD_MULTI@DF_MULTI/ (accessed on 2026-09-11)"}

  - name: provenance_takes_members_total_use_release_date_when_it_is_the_later_one
    model: dc_imputed_multilateral_sectors_provenance
    description: >
      imported_source_release_date is the later of the two sources' release dates, here
      Members' Total Use's.
    given:
      - input: ref('dc_imputed_multilateral_sectors_observations')
        rows:
          - {date: 2023}
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors_metadata')
        rows:
          - {downloaded_at: "2026-07-01 00:00:00+00", crs_release_date: "2026-04-10", multisystem_release_date: "2026-06-20"}
    expect:
      rows:
        - {imported_source_release_date: "2026-06-20"}

  - name: provenance_takes_members_total_use_next_release_when_it_is_the_earlier_one
    model: dc_imputed_multilateral_sectors_provenance
    description: >
      next_source_release_date is least() of each source's own next release,
      not always CRS's: a CRS release in December pushes CRS's own next
      release out to April of the following year, but a Members' Total Use
      release earlier that same year still expects its next release this
      December - before that April - so it is the date that wins here. This
      proves next_multisystem_release_date's output actually reaches
      least(), not just next_oecd_release_date's.
    given:
      - input: ref('dc_imputed_multilateral_sectors_observations')
        rows:
          - {date: 2023}
      - input: source('one_imputed_multilateral_sectors', 'raw_imputed_multilateral_sectors_metadata')
        rows:
          - {downloaded_at: "2026-12-20 00:00:00+00", crs_release_date: "2026-12-10", multisystem_release_date: "2026-01-15"}
    expect:
      rows:
        - {next_source_release_date: "2026-12"}
