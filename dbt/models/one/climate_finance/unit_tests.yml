unit_tests:
  - name: aggregated_sums_each_import_over_its_summed_dimension
    model: int_climate_finance_aggregated
    description: >
      Summing is this model's purpose: ONE Data's figures over the Bi_Multi
      code, the OECD's over the Bi_Multi code, and the UNFCCC totals over the
      type of funding. Two rows differing only in that dimension collapse into
      one row holding their sum in every amount, not a max, min or first value,
      while a row in another group is left alone. The UNFCCC status picks the
      flow.
    given:
      - input: ref('int_climate_finance_spending_resolved')
        rows:
          - {
              family: received,
              flow: commitments,
              method: ONE,
              attribution: contributions,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              bi_multi: 1,
              value: 10,
              adaptation: 1,
              mitigation: 2,
              cross_cutting: 3,
              unsplit: 4,
              no_adaptation_marker: 5,
            }
          - {
              family: received,
              flow: commitments,
              method: ONE,
              attribution: contributions,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              bi_multi: 4,
              value: 20,
              adaptation: 10,
              mitigation: 20,
              cross_cutting: 30,
              unsplit: 40,
              no_adaptation_marker: 50,
            }
          - {
              family: received,
              flow: commitments,
              method: ONE,
              attribution: contributions,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R2,
              bi_multi: 1,
              value: 7,
              adaptation: 1,
              mitigation: 1,
              cross_cutting: 1,
              unsplit: 1,
              no_adaptation_marker: 1,
            }
      - input: ref('int_climate_finance_crdf_commitments_resolved')
        rows:
          - {
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              bi_multi: 1,
              climate_usd: 5,
