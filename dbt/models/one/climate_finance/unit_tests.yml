  - name: mapped_resplits_each_figure_by_its_marker_assignment
    model: int_climate_finance_mapped
    description: >
      Under joint marker assignment (the OECD's full value, and the OECD's own
      commitments) adaptation and mitigation each hold the cross-cutting part,
      which comes out of both. Under highest-marker assignment (ONE Data's
      weighting) they hold none of it, and nothing comes out. Finance with no
      adaptation marker moves from mitigation to the unspecified part under
      both. The two received rows describe the same finance under each method,
      so their parts agree; a negative figure splits the same way. An
      unspecified part that rounds to 0.00 is left out, and the UNFCCC total
      has no parts.
    given:
      - input: ref('int_climate_finance_aggregated')
        rows:
          - {
              import_name: one_climate_finance,
              family: received,
              flow: commitments,
              method: ONE,
              attribution: contributions,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              value: 100,
              adaptation: 30,
              mitigation: 50,
              cross_cutting: 20,
              unsplit: 0,
              no_adaptation_marker: 10,
            }
          - {
              import_name: one_climate_finance,
              family: received,
              flow: commitments,
              method: OECD,
              attribution: contributions,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              value: 100,
              adaptation: 50,
              mitigation: 70,
              cross_cutting: 20,
              unsplit: 0,
              no_adaptation_marker: 10,
            }
          - {
              import_name: one_climate_finance,
              family: provided,
              flow: disbursements,
              method: OECD,
              attribution: outflows,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              value: -10,
              adaptation: -6,
              mitigation: -8,
              cross_cutting: -4,
              unsplit: 0,
              no_adaptation_marker: -1,
            }
          - {
              import_name: oecd_crdf,
              family: received,
              flow: commitments,
              method: OECD,
              attribution: null,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              value: 100,
              adaptation: 50,
              mitigation: 70,
              cross_cutting: 20,
              unsplit: 0,
              no_adaptation_marker: 0.004,
            }
          - {
              import_name: unfccc_btr,
              family: received,
              flow: commitments,
              method: null,
              attribution: null,
              year: 2022,
              financing_provider: P1,
              financing_recipient: null,
              value: 300,
              adaptation: null,
              mitigation: null,
              cross_cutting: null,
              unsplit: null,
              no_adaptation_marker: null,
            }
      - input: ref('climate_finance_methods')
        rows:
          - {
              import_name: one_climate_finance,
              family: received,
              method: ONE,
              attribution: contributions,
              measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignment",
              joint_marker_assignment: false,
            }
          - {
              import_name: one_climate_finance,
              family: received,
              method: OECD,
              attribution: contributions,
              measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
              joint_marker_assignment: true,
            }
          - {
              import_name: one_climate_finance,
              family: provided,
              method: OECD,
              attribution: outflows,
              measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignmentFundingShareAttribution",
              joint_marker_assignment: true,
            }
          - {
              import_name: oecd_crdf,
              family: received,
              method: OECD,
              attribution: null,
              measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
              joint_marker_assignment: true,
            }
          - {
              import_name: unfccc_btr,
              family: received,
              method: null,
              attribution: null,
              measurement_method: "dcid:Estimated",
              joint_marker_assignment: null,
            }
      - input: ref('stat_type_mapping')
        rows:
          - { stat_type: measuredValue, dcid_segment: null }
    expect:
      rows:
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignment",
            climate_policy_objective: "dcid:ClimateChangePolicyObjective",
            value: 100,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignment",
            climate_policy_objective: "dcid:AdaptationOnlyClimateChangePolicyObjective",
            value: 30,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignment",
            climate_policy_objective: "dcid:MitigationOnlyClimateChangePolicyObjective",
            value: 40,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignment",
            climate_policy_objective: "dcid:CrossCuttingClimateChangePolicyObjective",
            value: 20,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignment",
            climate_policy_objective: "dcid:UnspecifiedClimateChangePolicyObjective",
            value: 10,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:ClimateChangePolicyObjective",
            value: 100,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:AdaptationOnlyClimateChangePolicyObjective",
            value: 30,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:MitigationOnlyClimateChangePolicyObjective",
            value: 40,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:CrossCuttingClimateChangePolicyObjective",
            value: 20,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:UnspecifiedClimateChangePolicyObjective",
            value: 10,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignmentFundingShareAttribution",
            climate_policy_objective: "dcid:ClimateChangePolicyObjective",
            value: -10,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignmentFundingShareAttribution",
            climate_policy_objective: "dcid:AdaptationOnlyClimateChangePolicyObjective",
            value: -2,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignmentFundingShareAttribution",
            climate_policy_objective: "dcid:MitigationOnlyClimateChangePolicyObjective",
            value: -3,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignmentFundingShareAttribution",
            climate_policy_objective: "dcid:CrossCuttingClimateChangePolicyObjective",
            value: -4,
          }
        - {
            import_name: one_climate_finance,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignmentFundingShareAttribution",
            climate_policy_objective: "dcid:UnspecifiedClimateChangePolicyObjective",
            value: -1,
          }
        - {
            import_name: oecd_crdf,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:ClimateChangePolicyObjective",
            value: 100,
          }
        - {
            import_name: oecd_crdf,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:AdaptationOnlyClimateChangePolicyObjective",
            value: 30,
          }
        - {
            import_name: oecd_crdf,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:MitigationOnlyClimateChangePolicyObjective",
            value: 49.996,
          }
        - {
            import_name: oecd_crdf,
            measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
            climate_policy_objective: "dcid:CrossCuttingClimateChangePolicyObjective",
            value: 20,
          }
        - {
            import_name: unfccc_btr,
            measurement_method: "dcid:Estimated",
            climate_policy_objective: "dcid:ClimateChangePolicyObjective",
            value: 300,
          }

  - name: mapped_mints_the_statvars_as_literal_dcids_and_names
    model: int_climate_finance_mapped
    description: >
      climatePolicyObjective is the last constraint, so ONE Data's and the
      OECD's received commitments mint the same StatVar, dcid and name alike,
      and the measurement method stays out of both. The UNFCCC totals carry the
      AllRecipients segment before the qualifier and say "all recipients" in
      their names, which keeps them apart from the per-recipient received
      StatVars. Provided finance measures attributedAmount. constraint_properties
      pins the keys the dcid does not read.
    given:
      - input: ref('int_climate_finance_aggregated')
        rows:
          - {
              import_name: one_climate_finance,
              family: received,
              flow: commitments,
              method: ONE,
              attribution: contributions,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              value: 1,
              adaptation: 1,
              mitigation: 0,
              cross_cutting: 0,
              unsplit: 0,
              no_adaptation_marker: 0,
            }
          - {
              import_name: oecd_crdf,
              family: received,
              flow: commitments,
              method: OECD,
              attribution: null,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              value: 1,
              adaptation: 1,
              mitigation: 0,
              cross_cutting: 0,
              unsplit: 0,
              no_adaptation_marker: 0,
            }
          - {
              import_name: one_climate_finance,
              family: provided,
              flow: disbursements,
              method: ONE,
              attribution: contributions,
              year: 2022,
              financing_provider: P1,
              financing_recipient: R1,
              value: 1,
              adaptation: 0,
              mitigation: 1,
              cross_cutting: 0,
              unsplit: 0,
              no_adaptation_marker: 0,
