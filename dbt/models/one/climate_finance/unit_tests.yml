              attribution: null,
              year: 2022,
              financing_provider: P1,
              financing_recipient: null,
              value: 1,
              adaptation: null,
              mitigation: null,
              cross_cutting: null,
              unsplit: null,
              no_adaptation_marker: null,
            }
          - {
              import_name: unfccc_btr,
              family: received,
              flow: disbursements,
              method: null,
              attribution: null,
              year: 2022,
              financing_provider: P1,
              financing_recipient: null,
              value: 1,
              adaptation: null,
              mitigation: null,
              cross_cutting: null,
              unsplit: null,
              no_adaptation_marker: null,
            }
      - input: ref('climate_finance_methods')
        rows:
          - {
              import_name: one_climate_finance,
              family: received,
              method: ONE,
              attribution: contributions,
              measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignment",
              joint_marker_assignment: false,
            }
          - {
              import_name: one_climate_finance,
              family: provided,
              method: ONE,
              attribution: contributions,
              measurement_method: "dcid:MarkerScoreWeightingHighestMarkerAssignmentSpendingShareAttribution",
              joint_marker_assignment: false,
            }
          - {
              import_name: oecd_crdf,
              family: received,
              method: OECD,
              attribution: null,
              measurement_method: "dcid:FullValueMarkerWeightingJointMarkerAssignment",
              joint_marker_assignment: true,
            }
          - {
              import_name: unfccc_btr,
              family: received,
              method: null,
              attribution: null,
              measurement_method: "dcid:Estimated",
              joint_marker_assignment: null,
            }
      - input: ref('stat_type_mapping')
        rows:
          - { stat_type: measuredValue, dcid_segment: null }
    expect:
      format: dict
      rows:
        - {
            import_name: one_climate_finance,
            statvar_dcid: "dcid:Amount_FinancialObligation_Commitment_ClimateChangePolicyObjective_Nominal",
