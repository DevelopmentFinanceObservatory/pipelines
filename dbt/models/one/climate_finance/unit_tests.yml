          - {
              party: AAA,
              financing_provider: P1,
              year: 2022,
              status: committed,
              funding: oda,
              face_usd_at_dac: 100,
            }
          - {
              party: AAA,
              financing_provider: P1,
              year: 2022,
              status: committed,
              funding: oof,
              face_usd_at_dac: 200,
            }
          - {
              party: AAA,
              financing_provider: P1,
              year: 2022,
              status: disbursed,
              funding: oda,
              face_usd_at_dac: 40,
            }
    expect:
      rows:
        - {
            import_name: one_climate_finance,
            family: received,
            flow: commitments,
            method: ONE,
            attribution: contributions,
            year: 2022,
            financing_provider: P1,
