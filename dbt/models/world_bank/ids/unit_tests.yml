          - {series_code: DT.NFL.MIDA.CD, series_name: "Net financial flows, IDA (NFL, current US$)", statvar_name: "Net flows on concessional external debt (debt instrument) (current US$)", statvar_dcid: "dcid:Amount_FinancialFlow_Net_Disbursement_PrincipalRepayment_DebtInstrument_IDSConcessional_Nominal", population_type: dcid:FinancialFlow, measured_property: dcid:amount, stat_type: dcid:measuredValue, measurement_qualifier: dcid:Nominal, unit: dcid:CurrencyUSD, measurement_denominator: null, constraint_properties: "nettingBasis,financialFlowType,netOf,financingResource,idsConcessionality", financial_obligation_type: null, financial_flow_type: dcid:Disbursement, netting_basis: dcid:Net, net_of: dcid:PrincipalRepayment, financial_position_type: null, currency_of_denomination: null, financing_resource: dcid:DebtInstrument, financing_form: null, ids_concessionality: dcid:IDSConcessional, ids_creditor_type: null, guarantee_status: null, maturity_band: null, includes_imf_credit: null, ids_debtor_type: null, interest_rate_variability: null, creditor_breakdown: null, has_provider: true}
          - {series_code: DT.DIS.DIMF.CD, series_name: "IMF purchases (DIS, current US$)", statvar_name: "Disbursements on external debt (debt instrument) (current US$)", statvar_dcid: "dcid:Amount_FinancialFlow_Disbursement_DebtInstrument_Nominal", population_type: dcid:FinancialFlow, measured_property: dcid:amount, stat_type: dcid:measuredValue, measurement_qualifier: dcid:Nominal, unit: dcid:CurrencyUSD, measurement_denominator: null, constraint_properties: "financialFlowType,financingResource", financial_obligation_type: null, financial_flow_type: dcid:Disbursement, netting_basis: null, net_of: null, financial_position_type: null, currency_of_denomination: null, financing_resource: dcid:DebtInstrument, financing_form: null, ids_concessionality: null, ids_creditor_type: null, guarantee_status: null, maturity_band: null, includes_imf_credit: null, ids_debtor_type: null, interest_rate_variability: null, creditor_breakdown: null, has_provider: true}
    expect:
      rows:
        # the merged pair: one row, both codes and names kept
        - {dcid: "dcid:Amount_FinancialFlow_Net_Disbursement_PrincipalRepayment_DebtInstrument_IDSConcessional_Nominal", name: "Net flows on concessional external debt (debt instrument) (current US$)", description: "Net financial flows, IMF concessional (NFL, current US$); Net financial flows, IDA (NFL, current US$)", source_indicator_code: '"DT.NFL.IMFC.CD","DT.NFL.MIDA.CD"', observation_properties: "financingProvider,financingRecipient"}
