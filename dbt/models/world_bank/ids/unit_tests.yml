  - name: merged_variables_keep_every_source
    model: dc_ids_statvars
    description: >
      Four series describe two variables: the lender sits on the observation, so
      the same measure reported by two lenders mints one DCID and one name, and
      the rows group here. The group keeps every source code and World Bank name.
      The single-source control proves a variable with one source keeps just its
      own.
