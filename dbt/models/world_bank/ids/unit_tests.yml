  - name: mapped_splits_a_series_reported_both_ways_into_two_variables
    model: int_ids_mapped
    description: >
      A series reported both across all creditors and itemised by creditor measures
      a total and its parts, so it yields two variables rather than one holding
      both. A series reported only across all creditors yields the total alone,
      which is the shape of a series with no creditor dimension.
    given:
      - input: ref('int_ids_unified')
        rows:
          - {debtor: "dcid:country/ZMB", creditor: null, series_code: DT.AMT.BLAT.CB.CD, series_name: Bilateral, year: 2023, value: 1, series_code_pos_1: DT, series_code_pos_2: AMT, series_code_pos_3: BLAT, series_code_pos_4: CB, series_code_pos_5: CD}
          - {debtor: "dcid:country/ZMB", creditor: "dcid:country/AUT", series_code: DT.AMT.BLAT.CB.CD, series_name: Bilateral, year: 2023, value: 2, series_code_pos_1: DT, series_code_pos_2: AMT, series_code_pos_3: BLAT, series_code_pos_4: CB, series_code_pos_5: CD}
          - {debtor: "dcid:country/ZMB", creditor: null, series_code: DT.DOD.DECT.PC.CD, series_name: "External debt stocks per capita", year: 2023, value: 3, series_code_pos_1: DT, series_code_pos_2: DOD, series_code_pos_3: DECT, series_code_pos_4: PC, series_code_pos_5: CD}
      - {input: ref('code_mapping'), format: csv, fixture: ids_test_code_mapping}
      - {input: ref('ids_measure_mapping'), format: csv, fixture: ids_test_measure_mapping}
      - {input: ref('ids_unit_mapping'), format: csv, fixture: ids_test_unit_mapping}
      - {input: ref('stat_type_mapping'), format: csv, fixture: ids_test_stat_type_mapping}
    expect:
      rows:
        - {series_code: DT.AMT.BLAT.CB.CD, creditor_breakdown: null, statvar_name: "Principal repayments on external debt owed by the central bank to bilateral creditors (current US$)"}
        - {series_code: DT.AMT.BLAT.CB.CD, creditor_breakdown: "dcid:ByCreditor", statvar_name: "Principal repayments on external debt owed by the central bank to bilateral creditors, by creditor (current US$)"}
        - {series_code: DT.DOD.DECT.PC.CD, creditor_breakdown: null, statvar_name: "Outstanding external debt (current US$ per person)"}

  - name: observations_send_a_total_and_its_parts_to_different_variables
    model: int_ids_observations
    description: >
      The same series, debtor and year reported both across all creditors and
      against one creditor. The total carries no provider and must land on the total
      variable; the itemised row must land on the one constrained to a creditor
      breakdown. Paired deliberately: on one variable these two would be a duplicate
      observation key, and summing them would double count.
    given:
      - input: ref('int_ids_unified')
        rows:
          - {debtor: "dcid:country/ZMB", creditor: null, series_code: DT.AMT.BLAT.CB.CD, series_name: Bilateral, year: 2023, value: 30}
          - {debtor: "dcid:country/ZMB", creditor: "dcid:country/AUT", series_code: DT.AMT.BLAT.CB.CD, series_name: Bilateral, year: 2023, value: 10}
      - input: ref('int_ids_mapped')
        rows:
          - {series_code: DT.AMT.BLAT.CB.CD, creditor_breakdown: null, has_provider: false, statvar_dcid: "dcid:Total", unit: dcid:CurrencyUSD}
          - {series_code: DT.AMT.BLAT.CB.CD, creditor_breakdown: "dcid:ByCreditor", has_provider: true, statvar_dcid: "dcid:ByCreditorTotal", unit: dcid:CurrencyUSD}
    expect:
      rows:
        - {variable: "dcid:Total", date: 2023, financing_provider: null, financing_recipient: "dcid:country/ZMB", value: 30, unit: dcid:CurrencyUSD}
        - {variable: "dcid:ByCreditorTotal", date: 2023, financing_provider: "dcid:country/AUT", financing_recipient: "dcid:country/ZMB", value: 10, unit: dcid:CurrencyUSD}

