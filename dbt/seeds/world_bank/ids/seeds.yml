version: 2

seeds:
  - name: ids_measure_mapping
    description: >
      StatVar properties fixed by each World Bank IDS measure, keyed on the first
      two segments of the series code: its population type, measured property and
      stat type, and where the measure sets them, its unit, what it is net of, its
      fixed capital consumption basis and the property its observations are about.
      Transcribed from the Position 2 block of the IDS mapping spreadsheet's
      Segment code mapping tab.

      Keyed on the dataset prefix as well as the measure because a measure code can
      mean different things under different prefixes.
    config:
      column_types:
        dataset: string
        measure: string
        population_type: string
        measured_property: string
        stat_type: string
        unit: string
        net_of: string
        fixed_capital_consumption_basis: string
        entity_property: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dataset
              - measure
    columns:
      - name: dataset
        description: >
          First segment of the series code, which the World Bank calls the dataset
          prefix, e.g. DT for external debt
        data_tests:
          - not_null
      - name: measure
        description: Second segment of the series code, e.g. DOD for debt outstanding
        data_tests:
          - not_null
      - name: population_type
        description: DCID of the population the measure counts
        data_tests:
          - not_null
      - name: measured_property
        description: DCID of the property the measure reports
        data_tests:
          - not_null
      - name: stat_type
        description: DCID of the stat type, measuredValue except on the average-terms measures
        data_tests:
          - not_null
      - name: unit
        description: >
          DCID of the unit where the measure fixes it, as the average-terms and
          currency-composition measures do. Otherwise the unit segment supplies it.
      - name: net_of
        description: >
          DCID of what is subtracted, on the two net measures. Not in code_mapping
          because NFL and NTR already key to Disbursement there, and one code cannot
          resolve to two nodes within one list.
      - name: fixed_capital_consumption_basis
        description: DCID of the fixed capital consumption basis, set for GNI only
      - name: entity_property
        description: >
          The observation property naming the debtor: financingRecipient for a debt
          measure, whose itemised observations name the creditor as well, and
          observationAbout for a measure of the debtor economy itself, such as GNI
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['financingRecipient', 'observationAbout']

  - name: ids_unit_mapping
    description: >
      Unit and denominator properties for the trailing segments of a World Bank IDS
      series code, for the series the import publishes. Transcribed from the
      Trailing segments block of the IDS mapping spreadsheet's Segment code mapping
      tab.
    config:
      column_types:
        code: string
        role: string
        unit: string
        measurement_qualifier: string
        denominator_series_code: string
        denominator_dcid: string
    columns:
      - name: code
        description: The segment as published
        data_tests:
          - not_null
          - unique
      - name: role
        description: >
          Whether the segment names the unit or the denominator. Only the unit rows
          are candidates for the rightmost-unit-segment rule; a denominator is read
          from position 4.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unit, denominator]
      - name: unit
        description: DCID of the unit, empty where the segment only qualifies
      - name: measurement_qualifier
        description: DCID qualifying how the value is measured
      - name: denominator_series_code
        description: >
          Series code whose StatVar is the denominator. Resolved against the minted
          StatVars rather than seeded as a DCID, because this pipeline mints them.
      - name: denominator_dcid
        description: >
          DCID of the denominator where it is an existing Data Commons StatVar rather
          than one of this dataset's own series. Per capita is the only such case.
