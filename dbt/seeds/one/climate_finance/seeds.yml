version: 2

seeds:
  - name: climate_finance_methods
    description: >
      The measurement method of every figure the three climate finance imports
      publish, by import, family, weighting and attribution rule, and whether
      that weighting assigns a project marked for both objectives to both
      (joint marker assignment) or to its highest marker alone. The method
      dcid names the assignment rule, so the flag and the dcid are set
      together on one row.
    config:
      column_types:
        import_name: string
        family: string
        method: string
        attribution: string
        measurement_method: string
        joint_marker_assignment: boolean
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: climate_finance_method_per_import_family_weighting_and_attribution
          arguments:
            combination_of_columns:
              - import_name
              - family
              - method
              - attribution
    columns:
      - name: import_name
        description: The import the figures belong to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [one_climate_finance, oecd_crdf, unfccc_btr]
      - name: family
        description: >
          received, finance measured as the amount a provider gives, or
          provided, a provider's attributed share of multilateral finance
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [received, provided]
      - name: method
        description: >
          The weighting, ONE Data's (ONE) or the OECD's full value (OECD).
          Empty for the UNFCCC figures, which the parties estimate themselves.
      - name: attribution
        description: >
          How a provider's core contributions to multilaterals are attributed
          to it: by the multilateral's climate spending share (contributions)
          or by the OECD's outflow shares (outflows). Empty for the OECD's and
          the UNFCCC figures.
      - name: measurement_method
        description: DCID of the measurement method node the observations carry
        data_tests:
          - not_null
      - name: joint_marker_assignment
        description: >
          Whether the weighting counts a project marked for both adaptation and
          mitigation under both, so its cross-cutting part is an overlap held
          in adaptation and in mitigation alike. Empty where the figures have
          no split by objective.
        data_tests:
          - not_null:
              config:
                where: "method is not null"
