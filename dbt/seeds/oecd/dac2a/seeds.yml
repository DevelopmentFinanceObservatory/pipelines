version: 2

seeds:
  - name: dac2a_indicator_mapping
    description: >
      Each DAC2a aid type the import publishes, with the properties of the
      StatVar it measures. Each aid type is one StatVar.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: one_dac2a_aid_type_per_statvar_identity
          description: >
            Fails if two aid types set the same properties, which would mint
            one StatVar DCID for both and publish two values under one
            observation key.
          arguments:
            combination_of_columns:
              - population_type
              - measured_property
              - stat_type
              - measurement_qualifier
              - financial_flow_type
              - netting_basis
              - dac_type_of_finance
              - dac2a_aid_type
              - measurement_denominator
      - dbt_utils.unique_combination_of_columns:
          name: one_dac2a_aid_type_per_statvar_name
          description: >
            Fails if two aid types sharing a dac2aAidType constraint are named
            alike, since the netting basis and the denominator are all that
            tell their names apart.
          arguments:
            combination_of_columns:
              - dac2a_aid_type
              - netting_basis
              - measurement_denominator
    config:
      column_types:
        aid_type: string
        population_type: string
        measured_property: string
        stat_type: string
        measurement_qualifier: string
        measurement_method: string
        financial_flow_type: string
        netting_basis: string
        dac_type_of_finance: string
        dac2a_aid_type: string
        measurement_denominator: string
        unit: string
    columns:
      - name: aid_type
        description: DAC2a aid type code
        data_tests:
          - not_null
          - unique
      - name: population_type
        description: DCID of the population type
        data_tests:
          - not_null
      - name: measured_property
        description: DCID of the measured property
        data_tests:
          - not_null
      - name: stat_type
        description: DCID of the stat type
        data_tests:
          - not_null
      - name: measurement_qualifier
        description: DCID of the measurement qualifier
        data_tests:
          - not_null
      - name: measurement_method
        description: DCID of the measurement method, set for the modelled imputed multilateral ODA only
      - name: financial_flow_type
        description: >
          DCID of the financialFlowType constraint. DAC2a records every line
          on a disbursement basis, as DAC1 does, so every aid type is a
          disbursement and the aid type alone says which line it is.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["dcid:Disbursement"]
      - name: netting_basis
        description: >
          DCID of the nettingBasis constraint, as DAC1 counts lines of the
          same kind: a grant is gross, and a repayment, interest received, a
          recovery or an offsetting entry is net. Empty where DAC2a states
          neither gross nor net. The StatVar name brackets it after the aid
          type label, e.g. net disbursements.
        data_tests:
          - accepted_values:
              arguments:
                values: ["dcid:Gross", "dcid:Net"]
      - name: dac_type_of_finance
        description: >
          DCID of the dacTypeOfFinance constraint, set where the aid type is
          wholly grants or wholly non-grants
      - name: dac2a_aid_type
        description: >
          DAC2a aid type code of the dac2aAidType constraint. A gross total
          takes the aid type of its net total, 240 that of 206 and 204 that of
          218, so the netting basis alone tells the pair apart. A share of GNI
          or a per person figure takes the aid type it measures.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dac2a_indicator_mapping')
                field: aid_type
      - name: measurement_denominator
        description: >
          DCID of the StatVar a ratio divides by: the recipient's GNI, which the
          IDS import defines, or its population
      - name: unit
        description: DCID of the unit
        data_tests:
          - not_null
