name: CI

# Runs on every pull request, including a stacked one whose base is another
# feature branch, and skips while the pull request is a draft. `ready_for_review` is in the types so that marking it ready starts
# the run: without it the skipped jobs would stand as passing required checks
# on the commit and nothing would have tested it. `lint` and `test` are the
# required checks on both branches, which require the head to be up to date
# with its base, so the tree a merge produces is the tree these jobs tested and
# a push run would repeat them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Every uv command uses uv.lock as committed and fails if it is stale.
env:
  UV_LOCKED: "1"

jobs:
  lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Install dbt dependencies
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dbt deps --project-dir dbt/ --profiles-dir dbt/

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      # UV_NO_ENV_FILE makes the sqlfluff hook ignore `--env-file .env`, absent in CI.
      - name: Run pre-commit hooks
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
          UV_NO_ENV_FILE: "1"
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Naming any permission drops the rest. `contents: read` serves checkout and
    # `pull-requests: write` serves the graph check comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Install dbt dependencies
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dbt deps --project-dir dbt/ --profiles-dir dbt/

      - name: Check Dagster definitions load
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dg check defs

      - name: Load test data
        run: uv run duckdb /tmp/ci.duckdb < scripts/load_ci_fixtures.sql

      - name: Check dbt models build
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dbt build --project-dir dbt/ --profiles-dir dbt/

      # Advisory: the report says whether the StatVar tables the build wrote name
      # classes, properties and values the graph holds. A step that fails or a
      # check that cannot run leaves the job green.
      - name: Check StatVars against the graph
        continue-on-error: true
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
          GRAPH_CHECK_URL: ${{ vars.GRAPH_CHECK_URL }}
        run: uv run python scripts/graph_check.py "$RUNNER_TEMP/graph-check-report.md"

      # The report starts with a hidden marker line, which finds the comment this
      # step wrote on an earlier push. A pull request from a fork has a read-only
      # token, so this step can fail there; the job summary still carries the report.
      - name: Comment the graph check on the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          report="$RUNNER_TEMP/graph-check-report.md"
          marker="$(head -n 1 "$report")"
          comment_id="$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" \
            | jq -r --arg marker "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker))) | .id' \
            | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -F body=@"$report"
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -F body=@"$report"
          fi

      - name: Run tests
        run: uv run pytest --cov='src/dfo_pipelines' --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
