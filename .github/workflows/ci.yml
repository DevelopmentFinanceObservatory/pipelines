name: CI

# Runs on every pull request, including a stacked one whose base is another
# feature branch, and skips while the pull request is a draft. `ready_for_review` is in the types so that marking it ready starts
# the run: without it the skipped jobs would stand as passing required checks
# on the commit and nothing would have tested it. `lint` and `test` are the
# required checks on both branches, which require the head to be up to date
# with its base, so the tree a merge produces is the tree these jobs tested and
# a push run would repeat them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Every uv command uses uv.lock as committed and fails if it is stale.
env:
  UV_LOCKED: "1"

jobs:
  lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Install dbt dependencies
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dbt deps --project-dir dbt/ --profiles-dir dbt/

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      # UV_NO_ENV_FILE makes the sqlfluff hook ignore `--env-file .env`, absent in CI.
      - name: Run pre-commit hooks
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
          UV_NO_ENV_FILE: "1"
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Naming any permission drops the rest. `contents: read` serves checkout and
    # `pull-requests: write` serves the graph check comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python 3.13
        run: uv python install '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Install dbt dependencies
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dbt deps --project-dir dbt/ --profiles-dir dbt/

      - name: Check Dagster definitions load
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dg check defs

      - name: Load test data
        run: uv run duckdb /tmp/ci.duckdb < scripts/load_ci_fixtures.sql

      - name: Check dbt models build
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
        run: uv run dbt build --project-dir dbt/ --profiles-dir dbt/

      - name: Run tests
        run: uv run pytest --cov='src/dfo_pipelines' --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml

      # Advisory: the report says whether the StatVar tables the build wrote name
      # classes, properties and values the graph holds, and which commit it
      # checked. A step that fails or a check that cannot run leaves the job green.
      # Both steps run after a failed step too, so the comment describes the
      # latest push the job ran on. The job skips draft pull requests, so a
      # draft's comment describes its last push before it became a draft.
      - name: Check StatVars against the graph
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          DUCKDB_PATH: /tmp/ci.duckdb
          GRAPH_CHECK_URL: ${{ vars.GRAPH_CHECK_URL }}
          GRAPH_CHECK_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/graph_check.py "$RUNNER_TEMP/graph-check-report.md"

      # The report starts with a hidden marker line, which finds the comment this
      # step wrote on an earlier push. When the check step wrote no report, the
      # comment says so. When the pull request's head has moved past this run's
      # commit, the run for the head commit writes the comment. The step updates
      # the first comment it finds and deletes every later one that carries the
      # marker and was written by github-actions[bot], after the head check and
      # the update. A pull request from a fork has a read-only token, so this step
      # can fail there, and the job summary carries the report or says why the
      # check did not run.
      - name: Comment the graph check on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report="$RUNNER_TEMP/graph-check-report.md"
          if [ ! -s "$report" ]; then
            printf '%s\n%s\n\n%s\n' '<!-- dfo-graph-check -->' \
              'The graph check did not run. The check step wrote no report, and the job log says why.' \
              "Checked at commit \`${HEAD_SHA:0:7}\`." \
              > "$report"
          fi
          marker="$(head -n 1 "$report")"
          comment_ids="$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" \
            | jq -r --arg marker "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker))) | .id')"
          current_sha="$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST" --jq .head.sha)"
          if [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "The pull request's head is now $current_sha, so the run for that commit writes the comment."
            exit 0
          fi
          first_id=""
          later_ids=""
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if [ -z "$first_id" ]; then
              first_id="$id"
            else
              later_ids="$later_ids $id"
            fi
          done <<< "$comment_ids"
          if [ -z "$first_id" ]; then
            gh api --method POST "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -F body=@"$report"
            exit 0
          fi
          gh api --method PATCH "repos/$REPOSITORY/issues/comments/$first_id" -F body=@"$report"
          for id in $later_ids; do
            gh api --method DELETE "repos/$REPOSITORY/issues/comments/$id"
          done
